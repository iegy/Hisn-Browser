name: Android build and APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hisn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools"
          echo "--- available API 36/37 packages ---"
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[67]|build-tools;3[67]" || true
      - name: Set up Gradle and caching
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Run unit tests, lint and build
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk" || { echo "ERROR: expected APK was not generated: $apk" >&2; exit 1; }
          mkdir -p artifacts
          cp "$apk" artifacts/Hisn-Browser-debug.apk
          sha256sum artifacts/Hisn-Browser-debug.apk | tee artifacts/SHA256SUMS.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Hisn-Browser-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
